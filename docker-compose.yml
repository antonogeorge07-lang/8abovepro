version: '3.8'

services:
  8above-core-backend:
    build: ./backend
    container_name: 8above_sovereign_node
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - sovereign_data:/app/data
    environment:
      - NODE_MODE=SOVEREIGN_AIR_GAPPED
      - DATABASE_URL=sqlite+aiosqlite:///data/sovereign_ledger.db

volumes:
  sovereign_data:
    driver: local
