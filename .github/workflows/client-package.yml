name: Build Client Deployment Package

on:
  workflow_dispatch:
    inputs:
      client:
        description: "Client deployment profile"
        required: true
        type: string
      release:
        description: "Immutable release tag, for example v0.1.0"
        required: true
        type: string
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  package-client:
    name: Client deployment package
    runs-on: ubuntu-latest

    steps:
      - name: Validate inputs
        shell: bash
        env:
          CLIENT: ${{ inputs.client }}
          RELEASE: ${{ inputs.release }}
        run: |
          case "$CLIENT" in
            ''|*[!a-z0-9-]*)
              echo "Invalid client identifier: $CLIENT"
              exit 1
              ;;
          esac

          case "$RELEASE" in
            v[0-9]*.[0-9]*.[0-9]*)
              ;;
            *)
              echo "Invalid release identifier: $RELEASE"
              echo "Expected an immutable version tag such as v0.1.0"
              exit 1
              ;;
          esac

      - name: Checkout requested release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify immutable release tag
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          git show-ref \
            --verify \
            --quiet \
            "refs/tags/${RELEASE}" || {
              echo "Release tag does not exist: ${RELEASE}"
              exit 1
            }

          EXPECTED="$(git rev-list -n 1 "${RELEASE}")"
          ACTUAL="$(git rev-parse HEAD)"

          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "Release checkout does not match immutable tag"
            exit 1
          fi

      - name: Validate client profile
        shell: bash
        env:
          CLIENT: ${{ inputs.client }}
        run: |
          PROFILE="deploy/clients/${CLIENT}/client.env.example"

          if [ ! -f "$PROFILE" ]; then
            echo "Unknown client profile: $CLIENT"
            exit 1
          fi

          echo "Validated client profile: $CLIENT"

      - name: Build client manifest
        shell: bash
        env:
          CLIENT: ${{ inputs.client }}
          RELEASE: ${{ inputs.release }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          mkdir -p out

          cp \
            "deploy/clients/${CLIENT}/client.env.example" \
            out/client-profile.env

          {
            echo "8above_release=${RELEASE}"
            echo "commit=${GITHUB_SHA}"
            echo "client=${CLIENT}"
            echo "environment=${TARGET_ENVIRONMENT}"
            echo "generated_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          } > out/deployment-manifest.txt

          sha256sum \
            out/client-profile.env \
            out/deployment-manifest.txt \
            > out/SHA256SUMS

      - name: Upload client deployment package
        uses: actions/upload-artifact@v4
        with:
          name: 8above-${{ inputs.client }}-${{ inputs.environment }}-${{ inputs.release }}
          path: out/
          if-no-files-found: error
