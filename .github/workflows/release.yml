name: 8above Sovereign Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate release
    uses: ./.github/workflows/reusable-release-validation.yml

  package:
    name: Build immutable release package
    runs-on: ubuntu-latest
    needs:
      - validate

    steps:
      - name: Checkout release
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Prepare release
        run: |
          mkdir -p release/8above

          cp -R backend release/8above/backend
          cp -R frontend/dist release/8above/frontend
          cp docker-compose.yml release/8above/
          cp -R deploy release/8above/deploy

          printf '%s\n' "${GITHUB_SHA}" \
            > release/8above/COMMIT_SHA

          printf '%s\n' "${GITHUB_REF_NAME}" \
            > release/8above/RELEASE_VERSION

      - name: Create checksums
        working-directory: release
        run: |
          tar \
            --exclude='*.pyc' \
            --exclude='__pycache__' \
            -czf "8above-${GITHUB_REF_NAME}.tar.gz" \
            8above

          sha256sum \
            "8above-${GITHUB_REF_NAME}.tar.gz" \
            > "8above-${GITHUB_REF_NAME}.sha256"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 8above-${{ github.ref_name }}
          path: |
            release/8above-${{ github.ref_name }}.tar.gz
            release/8above-${{ github.ref_name }}.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "release/8above-${GITHUB_REF_NAME}.tar.gz" \
            "release/8above-${GITHUB_REF_NAME}.sha256" \
            --title "8above ${GITHUB_REF_NAME}" \
            --generate-notes
